<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0B" />
    <title>آفلاین | نجیب‌زاده</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background: #f6f2eb;
        color: #0b0b0b;
        font-family: Tahoma, Arial, sans-serif;
      }
      main { width: min(420px, 100%); text-align: center; }
      img { display: block; width: 132px; height: 132px; margin: 0 auto 28px; object-fit: contain; }
      h1 { margin: 0 0 12px; font-size: 24px; line-height: 1.5; }
      p { margin: 0 0 24px; color: #57504a; font-size: 15px; line-height: 1.9; }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        border: 1px solid #0b0b0b;
        padding: 0 22px;
        background: #0b0b0b;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #c15427; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192x192.png" alt="نشان نجیب‌زاده" width="132" height="132" />
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>پس از وصل شدن اینترنت، دوباره وارد فروشگاه شوید.</p>
      <a href="/">تلاش دوباره</a>
    </main>
  </body>
</html>
